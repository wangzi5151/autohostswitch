name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false
      - name: 编译全平台
        run: ./build-all.sh "${GITHUB_REF_NAME}"
      - name: 生成校验和
        run: cd dist && sha256sum * > SHA256SUMS
      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: RELEASE_NOTES_TEMPLATE.md
