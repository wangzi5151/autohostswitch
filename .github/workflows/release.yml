name: Release

on:
  push:
    tags:
      - "v*"

# 最小权限：发布需要写 releases；attestation 需要 id-token
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false
      - name: 编译全平台
        run: ./build-all.sh "${GITHUB_REF_NAME}"
      - name: 生成校验和
        run: cd dist && sha256sum * > SHA256SUMS
      # 构建来源证明：用 Sigstore 给每个二进制做 attestation，
      # 用户可用 gh attestation verify 验证“这个二进制确实由本仓库 CI 构建”。
      - name: 生成构建来源证明
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"
      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: RELEASE_NOTES_TEMPLATE.md
