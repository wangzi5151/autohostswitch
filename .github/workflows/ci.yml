name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false
      - name: gofmt 检查
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: 单元测试
        run: go test -count=1 ./...
      - name: 全平台编译冒烟
        run: ./build-all.sh ci-test
